stages:
  - test
  - build
  - package
  - release

default:
  tags:
    - self-hosted
    - linux

variables:
  MCP_MAIN_PKG: "./mcp/"
  MCP_APP_NAME: "godai-mcp"
  GO_VERSION: "1.25.3"
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  CGO_ENABLED: "0"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/release-packages/${CI_COMMIT_TAG}"
cache:
  key: "go-${CI_COMMIT_REF_SLUG}"
  paths:
    - .go/pkg/mod/
    - .cache/go-build/

mcp-test:
  stage: test
  image: golang:${GO_VERSION}
  script:
    - go version
    - go env
    # -short skips the functional tests, which are run by the godot-test job.
    - go test -short ./...

# Runs the tests that need a real Godot editor: the GUT unit tests, and the
# functional tests of the editor's MCP server.
godot-test:
  stage: test
  image: golang:${GO_VERSION}
  variables:
    GODOT_VERSION: "4.6.3"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends unzip libfontconfig1
    - wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
    - unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
    - mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
    - rm "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
    - godot --version
  script:
    # Import the project, so its resources are available to the GUT tests.
    - godot --headless --import
    # The GUT unit tests. GUT exits non-zero on test failures, but exits zero
    # when it doesn't find any tests, so we have to check for that ourselves.
    - set -o pipefail
    - godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://tests/gut -gexit 2>&1 | tee gut-output.log
    - '! grep -q "Nothing was run" gut-output.log'
    # The functional tests of the addon's MCP server and the Go MCP server.
    # These launch their own headless editor; GODAI_TEST_VERBOSE streams its log
    # into the job output, since the temporary project directory can't be
    # inspected after the job.
    - GODAI_TEST_VERBOSE=1 go test -v -count=1 -timeout 10m ./tests/functional/...

# On release tags, require the version in plugin.cfg (the single source of
# truth) to match the tag, so a release can't be made with a stale version.
version-check:
  stage: test
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  image: alpine:latest
  cache: []
  script:
    - PLUGIN_VERSION="$(sed -n 's/^version="\(.*\)"$/\1/p' addons/godai/plugin.cfg)"
    - TAG_VERSION="${CI_COMMIT_TAG#v}"
    - echo "plugin.cfg version is '${PLUGIN_VERSION}'; release tag version is '${TAG_VERSION}'"
    - |
      if [ -z "$PLUGIN_VERSION" ] || [ "$PLUGIN_VERSION" != "$TAG_VERSION" ]; then
        echo "ERROR: the version in addons/godai/plugin.cfg doesn't match the release tag ${CI_COMMIT_TAG}."
        echo "Update plugin.cfg and re-tag."
        exit 1
      fi

mcp-build:
  stage: build
  image: golang:${GO_VERSION}
  parallel:
    matrix:
      - VARIANT: "linux-x86_64"
        GOOS: "linux"
        GOARCH: "amd64"
        EXT: ""
      - VARIANT: "linux-arm64"
        GOOS: "linux"
        GOARCH: "arm64"
        EXT: ""
      - VARIANT: "windows-x86_64"
        GOOS: "windows"
        GOARCH: "amd64"
        EXT: ".exe"
      - VARIANT: "windows-arm64"
        GOOS: "windows"
        GOARCH: "arm64"
        EXT: ".exe"
      - VARIANT: "macos-arm64"
        GOOS: "darwin"
        GOARCH: "arm64"
        EXT: ""
  script:
    - mkdir -p dist/mcp/${MCP_APP_NAME}-${VARIANT}

    - echo "Building for GOOS=$GOOS GOARCH=$GOARCH"
    - GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags="-s -w" -o "dist/mcp/${MCP_APP_NAME}-${VARIANT}/${MCP_APP_NAME}-${VARIANT}${EXT}" "$MCP_MAIN_PKG"
    # @todo Have MCP-specific README?
    - cp README.md LICENSE.txt dist/mcp/${MCP_APP_NAME}-${VARIANT}
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - dist/mcp/

mcp-package-bundle:
  stage: package
  image: node:current
  before_script:
    - npm install -g @anthropic-ai/mcpb
  script:
    - mkdir -p bundle/server
    - mkdir -p dist/mcpb

    # Only the binaries referenced by bundle/manifest.json.
    - cp dist/mcp/${MCP_APP_NAME}-linux-x86_64/${MCP_APP_NAME}-linux-x86_64 bundle/server/
    - cp dist/mcp/${MCP_APP_NAME}-windows-x86_64/${MCP_APP_NAME}-windows-x86_64.exe bundle/server/
    - cp dist/mcp/${MCP_APP_NAME}-macos-arm64/${MCP_APP_NAME}-macos-arm64 bundle/server/

    # Stamp the real version into manifest.json (committed as 0.0.0-dev).
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        BUNDLE_VERSION="${CI_COMMIT_TAG#v}"
      else
        BUNDLE_VERSION="0.0.0-dev.${CI_COMMIT_SHORT_SHA}"
      fi
      node bundle/set-bundle-version.mjs "$BUNDLE_VERSION"

    - (cd bundle && mcpb pack)

    - cp bundle/bundle.mcpb dist/mcpb/godai-mcp.mcpb
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - dist/mcpb/

# Validates the npm packaging on every pipeline (without publishing), so
# breakage is caught before release time.
mcp-package-npm:
  stage: package
  image: node:current
  script:
    - node npm/prepare-packages.mjs "0.0.0-dev.${CI_COMMIT_SHORT_SHA}"
    - |
      for dir in npm/dist/platforms/*/ npm/dist/godai-mcp/; do
        (cd "$dir" && npm pack --dry-run)
      done
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - npm/dist/

npm-publish:
  stage: release
  tags:
    - saas-linux-small-amd64
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  image: node:current
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: "sigstore"
  script:
    - node npm/prepare-packages.mjs "${CI_COMMIT_TAG#v}"
    # Platform packages first, so the main package's optionalDependencies
    # always resolve.
    - |
      for dir in npm/dist/platforms/*/; do
        (cd "$dir" && npm publish --access public)
      done
    - (cd npm/dist/godai-mcp && npm publish --access public)

release:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  image: registry.gitlab.com/gitlab-org/cli:latest
  before_script:
    - apk update
    - apk add curl zip
  script:
    - mkdir -p dist/release/

    # Upload the addon.
    - |
      PKG_FN=godai-addon-${CI_COMMIT_TAG}.zip
      zip -r dist/release/$PKG_FN addons/godai/
      cd dist/release
      echo curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file $PKG_FN ${PACKAGE_REGISTRY_URL}/$PKG_FN
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file $PKG_FN ${PACKAGE_REGISTRY_URL}/$PKG_FN
      cd ../..


    # Upload the individual MCP builds.
    - |
      cd dist/mcp
      for d in *; do
        PKG_DIR=$d-${CI_COMMIT_TAG}
        PKG_FN=${PKG_DIR}.zip

        mv $d $PKG_DIR
        zip -r ../release/$PKG_FN $PKG_DIR

        (cd ../release && curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file $PKG_FN ${PACKAGE_REGISTRY_URL}/$PKG_FN)
      done
      cd ../..

    # Upload the MCP bundle.
    - |
      PKG_FN=godai-mcp-${CI_COMMIT_TAG}.mcpb
      cp dist/mcpb/godai-mcp.mcpb dist/release/$PKG_FN
      (cd dist/release && curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file $PKG_FN ${PACKAGE_REGISTRY_URL}/$PKG_FN)
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG"
    assets:
      links:
        - name: "${MCP_APP_NAME}-windows-x86_64-${CI_COMMIT_TAG}.zip"
          url: "${PACKAGE_REGISTRY_URL}/${MCP_APP_NAME}-windows-x86_64-${CI_COMMIT_TAG}.zip"
        - name: "${MCP_APP_NAME}-windows-arm64-${CI_COMMIT_TAG}.zip"
          url: "${PACKAGE_REGISTRY_URL}/${MCP_APP_NAME}-windows-arm64-${CI_COMMIT_TAG}.zip"
        - name: "${MCP_APP_NAME}-linux-x86_64-${CI_COMMIT_TAG}.zip"
          url: "${PACKAGE_REGISTRY_URL}/${MCP_APP_NAME}-linux-x86_64-${CI_COMMIT_TAG}.zip"
        - name: "${MCP_APP_NAME}-linux-arm64-${CI_COMMIT_TAG}.zip"
          url: "${PACKAGE_REGISTRY_URL}/${MCP_APP_NAME}-linux-arm64-${CI_COMMIT_TAG}.zip"
        - name: "${MCP_APP_NAME}-macos-arm64-${CI_COMMIT_TAG}.zip"
          url: "${PACKAGE_REGISTRY_URL}/${MCP_APP_NAME}-macos-arm64-${CI_COMMIT_TAG}.zip"
        - name: "npm: @snopek-games/godai-mcp ${CI_COMMIT_TAG}"
          url: "https://www.npmjs.com/package/@snopek-games/godai-mcp"
        - name: "${MCP_APP_NAME}-${CI_COMMIT_TAG}.mcpb"
          url: "${PACKAGE_REGISTRY_URL}/${MCP_APP_NAME}-${CI_COMMIT_TAG}.mcpb"
        - name: "godai-addon.zip"
          url: "${PACKAGE_REGISTRY_URL}/godai-addon-${CI_COMMIT_TAG}.zip"
