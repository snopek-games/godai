stages:
  - test
  - build
  - package
  - release
  # Last, so nothing waits for this stage.
  - eval

default:
  tags:
    - self-hosted
    - linux

variables:
  CLI_MAIN_PKG: "./cmd/godai/"
  CLI_ASSET_NAME: "godai-cli"
  CLI_BIN_NAME: "godai"
  MCPB_NAME: "godai-mcp"
  GO_VERSION: "1.25.12"
  GODOT_VERSION: "4.6.3"
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  CGO_ENABLED: "0"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/release-packages/${CI_COMMIT_TAG}"
cache:
  key: "go-${CI_COMMIT_REF_SLUG}"
  paths:
    - .go/pkg/mod/
    - .cache/go-build/

go-test:
  stage: test
  image: golang:${GO_VERSION}
  script:
    - go version
    - go env
    # -short skips the functional tests, which the godot-test job runs.
    - go test -short ./...

godot-test:
  stage: test
  image: golang:${GO_VERSION}
  before_script:
    - ./scripts/install-godot.sh
  script:
    - godot --headless --import
    # GUT exits zero when it doesn't find any tests, so check for that too.
    - set -o pipefail
    - godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://tests/gut -gexit 2>&1 | tee gut-output.log
    - '! grep -q "Nothing was run" gut-output.log'
    # GODAI_TEST_VERBOSE streams the headless editor's log into the job output,
    # since its temporary project directory is gone by the time the job ends.
    - GODAI_TEST_VERBOSE=1 go test -v -count=1 -timeout 10m ./tests/functional/...

# plugin.cfg is the single source of truth for the version.
version-check:
  stage: test
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  image: alpine:latest
  cache: []
  script:
    - PLUGIN_VERSION="$(sed -n 's/^version="\(.*\)"$/\1/p' addons/godai/plugin.cfg)"
    - TAG_VERSION="${CI_COMMIT_TAG#v}"
    - echo "plugin.cfg version is '${PLUGIN_VERSION}'; release tag version is '${TAG_VERSION}'"
    - |
      if [ -z "$PLUGIN_VERSION" ] || [ "$PLUGIN_VERSION" != "$TAG_VERSION" ]; then
        echo "ERROR: the version in addons/godai/plugin.cfg doesn't match the release tag ${CI_COMMIT_TAG}."
        echo "Update plugin.cfg and re-tag."
        exit 1
      fi

cli-build:
  stage: build
  image: golang:${GO_VERSION}
  parallel:
    matrix:
      - VARIANT: "linux-x86_64"
        GOOS: "linux"
        GOARCH: "amd64"
        EXT: ""
      - VARIANT: "linux-arm64"
        GOOS: "linux"
        GOARCH: "arm64"
        EXT: ""
      - VARIANT: "windows-x86_64"
        GOOS: "windows"
        GOARCH: "amd64"
        EXT: ".exe"
      - VARIANT: "windows-arm64"
        GOOS: "windows"
        GOARCH: "arm64"
        EXT: ".exe"
      - VARIANT: "macos-arm64"
        GOOS: "darwin"
        GOARCH: "arm64"
        EXT: ""
      - VARIANT: "macos-x86_64"
        GOOS: "darwin"
        GOARCH: "amd64"
        EXT: ""
  script:
    - mkdir -p dist/cli/${CLI_ASSET_NAME}-${VARIANT}

    - echo "Building for GOOS=$GOOS GOARCH=$GOARCH"
    - GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags="-s -w" -o "dist/cli/${CLI_ASSET_NAME}-${VARIANT}/${CLI_BIN_NAME}${EXT}" "$CLI_MAIN_PKG"
    - cp README.md LICENSE.txt dist/cli/${CLI_ASSET_NAME}-${VARIANT}
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - dist/cli/

package-mcpb:
  stage: package
  image: node:current
  before_script:
    - npm install -g @anthropic-ai/mcpb
  script:
    - mkdir -p packaging/mcpb/server
    - mkdir -p dist/mcpb

    # Only the binaries referenced by packaging/mcpb/manifest.json.
    - cp dist/cli/${CLI_ASSET_NAME}-linux-x86_64/${CLI_BIN_NAME} packaging/mcpb/server/${CLI_BIN_NAME}-linux-x86_64
    - cp dist/cli/${CLI_ASSET_NAME}-windows-x86_64/${CLI_BIN_NAME}.exe packaging/mcpb/server/${CLI_BIN_NAME}-windows-x86_64.exe
    - cp dist/cli/${CLI_ASSET_NAME}-macos-arm64/${CLI_BIN_NAME} packaging/mcpb/server/${CLI_BIN_NAME}-macos-arm64

    # Tells `godai self-update` this install is managed by the bundle.
    - printf 'mcpb\n' > packaging/mcpb/server/godai-install-channel

    # manifest.json is committed with a placeholder version.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        BUNDLE_VERSION="${CI_COMMIT_TAG#v}"
      else
        BUNDLE_VERSION="0.0.0-dev.${CI_COMMIT_SHORT_SHA}"
      fi
      node packaging/mcpb/set-bundle-version.mjs "$BUNDLE_VERSION"

    - mcpb pack packaging/mcpb dist/mcpb/${MCPB_NAME}.mcpb
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - dist/mcpb/

package-npm:
  stage: package
  image: node:current
  script:
    - node packaging/npm/prepare-packages.mjs "0.0.0-dev.${CI_COMMIT_SHORT_SHA}"
    - |
      for dir in packaging/npm/dist/platforms/*/ packaging/npm/dist/godai/; do
        (cd "$dir" && npm pack --dry-run)
      done
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - packaging/npm/dist/

package-brew:
  stage: package
  image: alpine:latest
  cache: []
  before_script:
    - apk add zip ruby
  script:
    - VERSION="0.0.0-dev.${CI_COMMIT_SHORT_SHA}"
    - mkdir -p dist/brew
    - |
      cd dist/cli
      for d in ${CLI_ASSET_NAME}-macos-* ${CLI_ASSET_NAME}-linux-*; do
        zip -qr "../brew/$d-v$VERSION.zip" "$d"
      done
      cd ../brew
      sha256sum *.zip > checksums.txt
      cd ../..
    - packaging/brew/prepare-formula.sh "$VERSION" dist/brew/checksums.txt dist/brew/godai.rb
    - ruby -c dist/brew/godai.rb
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - dist/brew/godai.rb

package-install:
  stage: package
  image: mcr.microsoft.com/powershell:latest
  cache: []
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl unzip zip python3 shellcheck
  script:
    - shellcheck packaging/install/install.sh
    - VERSION="0.0.0-dev.${CI_COMMIT_SHORT_SHA}"

    # Lay out a fake package registry the same way the release job would.
    - mkdir -p fake-registry/v$VERSION
    - |
      cd dist/cli
      for VARIANT in linux-x86_64 windows-x86_64; do
        mv ${CLI_ASSET_NAME}-$VARIANT ${CLI_ASSET_NAME}-$VARIANT-v$VERSION
        zip -qr ../../fake-registry/v$VERSION/${CLI_ASSET_NAME}-$VARIANT-v$VERSION.zip ${CLI_ASSET_NAME}-$VARIANT-v$VERSION
      done
      cd ../../fake-registry/v$VERSION
      sha256sum *.zip > checksums-v$VERSION.txt
      cd ../..
    - python3 -m http.server --directory fake-registry --bind 127.0.0.1 8919 &
    - sleep 1

    - |
      GODAI_VERSION=$VERSION \
      GODAI_DOWNLOAD_BASE=http://127.0.0.1:8919 \
      GODAI_INSTALL_DIR=$PWD/test-install/sh \
      GODAI_NO_MODIFY_PATH=1 \
      sh packaging/install/install.sh
    - test-install/sh/godai --version

    - |
      GODAI_VERSION=$VERSION \
      GODAI_DOWNLOAD_BASE=http://127.0.0.1:8919 \
      GODAI_INSTALL_DIR=$PWD/test-install/ps \
      PROCESSOR_ARCHITECTURE=AMD64 \
      pwsh -NoProfile -File packaging/install/install.ps1
    - test -f test-install/ps/godai.exe

npm-publish:
  stage: release
  tags:
    - saas-linux-small-amd64
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  image: node:current
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: "sigstore"
  script:
    - node packaging/npm/prepare-packages.mjs "${CI_COMMIT_TAG#v}"
    - |
      for dir in packaging/npm/dist/platforms/*/; do
        (cd "$dir" && npm publish --access public)
      done
    - (cd packaging/npm/dist/godai && npm publish --access public)

brew-publish:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  needs:
    - job: release
      artifacts: true
  image: alpine:latest
  cache: []
  before_script:
    - apk add git
  script:
    - packaging/brew/prepare-formula.sh "${CI_COMMIT_TAG#v}" "dist/release/checksums-${CI_COMMIT_TAG}.txt" godai.rb
    - git clone "https://x-access-token:${BREW_TAP_GITHUB_TOKEN}@github.com/snopek-games/homebrew-godai.git" tap
    - mkdir -p tap/Formula
    - cp godai.rb tap/Formula/godai.rb
    - cd tap
    - git config user.name "GitLab CI"
    - git config user.email "dsnopek@gmail.com"
    - git add Formula/godai.rb
    - |
      if git diff --cached --quiet; then
        echo "Formula unchanged; nothing to push."
      else
        git commit -m "godai ${CI_COMMIT_TAG}"
        git push origin HEAD
      fi

# Keeps https://godai.sh/install and https://godai.sh/install.ps1 up to date:
# the website serves its src/install-scripts/ directory at the site root.
website-publish:
  stage: release
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - packaging/install/**/*
  needs: []
  image: alpine:latest
  cache: []
  variables:
    GIT_SSH_COMMAND: "ssh -i $CI_PROJECT_DIR/deploy_key -o UserKnownHostsFile=$CI_PROJECT_DIR/known_hosts -o IdentitiesOnly=yes"
  before_script:
    - apk add git openssh-client
    - echo "$WEBSITE_DEPLOY_KEY" > deploy_key
    - chmod 600 deploy_key
    # gitlab.com's published ed25519 host key (fingerprint
    # SHA256:eUXGGm1YGsMAS7vkcx6JOJdOGHPem5gQp4taiCfCLB8).
    - echo "gitlab.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAfuCHKVTjquxvt6CM6tdG4SLp1Btn/nOeHHE5UOzRdf" > known_hosts
  script:
    - git clone --depth 1 git@gitlab.com:snopek-games/godai-website.git website
    - cp packaging/install/install.sh website/src/install-scripts/install
    - cp packaging/install/install.ps1 website/src/install-scripts/install.ps1
    - cd website
    - git config user.name "GitLab CI"
    - git config user.email "dsnopek@gmail.com"
    - git add src/install-scripts
    - |
      if git diff --cached --quiet; then
        echo "Install scripts unchanged; nothing to push."
      else
        git commit -m "Update install scripts from godai ${CI_COMMIT_SHORT_SHA}"
        git push origin HEAD:main
      fi

release:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  image: registry.gitlab.com/gitlab-org/cli:latest
  before_script:
    - apk update
    - apk add curl zip
  script:
    - mkdir -p dist/release/

    # Everything is gathered into dist/release/ first, so the checksums can
    # cover all of it before any of it is uploaded.
    - zip -r dist/release/godai-addon-${CI_COMMIT_TAG}.zip addons/godai/

    - |
      cd dist/cli
      for d in *; do
        PKG_DIR=$d-${CI_COMMIT_TAG}
        mv $d $PKG_DIR
        zip -r ../release/${PKG_DIR}.zip $PKG_DIR
      done
      cd ../..

    - cp dist/mcpb/${MCPB_NAME}.mcpb dist/release/${MCPB_NAME}-${CI_COMMIT_TAG}.mcpb

    # `godai self-update` won't install a release without this file.
    - |
      cd dist/release
      sha256sum * > ../checksums.txt
      mv ../checksums.txt checksums-${CI_COMMIT_TAG}.txt
      cat checksums-${CI_COMMIT_TAG}.txt
      cd ../..

    - |
      cd dist/release
      for PKG_FN in *; do
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file $PKG_FN ${PACKAGE_REGISTRY_URL}/$PKG_FN
      done
      cd ../..
  artifacts:
    expire_in: 1 week
    paths:
      - dist/release/checksums-*.txt
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG"
    assets:
      links:
        - name: "${CLI_ASSET_NAME}-windows-x86_64-${CI_COMMIT_TAG}.zip"
          url: "${PACKAGE_REGISTRY_URL}/${CLI_ASSET_NAME}-windows-x86_64-${CI_COMMIT_TAG}.zip"
        - name: "${CLI_ASSET_NAME}-windows-arm64-${CI_COMMIT_TAG}.zip"
          url: "${PACKAGE_REGISTRY_URL}/${CLI_ASSET_NAME}-windows-arm64-${CI_COMMIT_TAG}.zip"
        - name: "${CLI_ASSET_NAME}-linux-x86_64-${CI_COMMIT_TAG}.zip"
          url: "${PACKAGE_REGISTRY_URL}/${CLI_ASSET_NAME}-linux-x86_64-${CI_COMMIT_TAG}.zip"
        - name: "${CLI_ASSET_NAME}-linux-arm64-${CI_COMMIT_TAG}.zip"
          url: "${PACKAGE_REGISTRY_URL}/${CLI_ASSET_NAME}-linux-arm64-${CI_COMMIT_TAG}.zip"
        - name: "${CLI_ASSET_NAME}-macos-arm64-${CI_COMMIT_TAG}.zip"
          url: "${PACKAGE_REGISTRY_URL}/${CLI_ASSET_NAME}-macos-arm64-${CI_COMMIT_TAG}.zip"
        - name: "${CLI_ASSET_NAME}-macos-x86_64-${CI_COMMIT_TAG}.zip"
          url: "${PACKAGE_REGISTRY_URL}/${CLI_ASSET_NAME}-macos-x86_64-${CI_COMMIT_TAG}.zip"
        - name: "npm: @snopek-games/godai ${CI_COMMIT_TAG}"
          url: "https://www.npmjs.com/package/@snopek-games/godai"
        - name: "brew: snopek-games/godai tap"
          url: "https://github.com/snopek-games/homebrew-godai"
        - name: "${MCPB_NAME}-${CI_COMMIT_TAG}.mcpb"
          url: "${PACKAGE_REGISTRY_URL}/${MCPB_NAME}-${CI_COMMIT_TAG}.mcpb"
        - name: "godai-addon.zip"
          url: "${PACKAGE_REGISTRY_URL}/godai-addon-${CI_COMMIT_TAG}.zip"
        - name: "checksums-${CI_COMMIT_TAG}.txt"
          url: "${PACKAGE_REGISTRY_URL}/checksums-${CI_COMMIT_TAG}.txt"

# The eval jobs; see tests/eval/README.md.

# Run this always: it's free, and our evaluation is invalid if the oracle stops working.
eval-solution:
  stage: eval
  image: golang:${GO_VERSION}
  needs: []
  before_script:
    - ./scripts/install-godot.sh
  script:
    - go run ./cmd/godai-eval run --solution --godot /usr/local/bin/godot --out results-solution.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - results-solution.json
      - results-solution-transcripts/

# The inverse of eval-solution: no agent runs at all, and every task has to
# fail. A task that passes untouched has verifiers that check nothing.
eval-pristine:
  stage: eval
  image: golang:${GO_VERSION}
  needs: []
  before_script:
    - ./scripts/install-godot.sh
  script:
    - go run ./cmd/godai-eval run --pristine --godot /usr/local/bin/godot --out results-pristine.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - results-pristine.json

eval-cells:
  stage: eval
  image: golang:${GO_VERSION}
  needs: []
  tags:
    - saas-linux-small-amd64
  rules:
    - if: '$ANTHROPIC_API_KEY == null || $ANTHROPIC_API_KEY == ""'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: manual
  allow_failure: true
  timeout: 1h
  variables:
    # Pin Claude Code version and disable auto-updates.
    CLAUDE_VERSION: "2.1.229"
    DISABLE_AUTOUPDATER: "1"
  before_script:
    - scripts/install-godot.sh
    - curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_VERSION"
    - export PATH="$HOME/.local/bin:$PATH"
    - claude --version
  parallel:
    matrix:
      - MODEL: [haiku, sonnet]
        SURFACE: [editor]
      - MODEL: [haiku, sonnet]
        SURFACE: [none, mcp, cli]
        EXTRA: "--full-tools"
  script:
    - mkdir -p results
    - |
      go run ./cmd/godai-eval run \
        --model "$MODEL" \
        --surface "$SURFACE" \
        --repeats 10 \
        --godot /usr/local/bin/godot \
        --out "results/${MODEL}-${SURFACE}.json" \
        --verbose \
        --bare \
        $EXTRA
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - results/

eval-compare:
  stage: eval
  image: golang:${GO_VERSION}
  tags:
    - saas-linux-small-amd64
  rules:
    - if: '$ANTHROPIC_API_KEY == null || $ANTHROPIC_API_KEY == ""'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: on_success
  needs:
    - job: eval-cells
      artifacts: true
  script:
    - go run ./cmd/godai-eval compare results/ --out eval-report.md
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - eval-report.md
      - results/
