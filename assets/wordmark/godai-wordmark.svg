  <!-- ============ Shield ============ -->
  <!-- Regular pentagon, point down. Centre (200,178), circumradius 180.
       Add stroke="#478cbf" stroke-width="12" stroke-linejoin="round"
       to this path if you want softened corners. -->
  <!-- ============ Kanji 五大 — stroked paths, no font ============ -->
  <g
     id="kanji"
     fill="none"
     stroke="#ffffff"
     stroke-width="7"
     stroke-linecap="round"
     stroke-linejoin="round"
     transform="matrix(1.1672526,0,0,1.1672526,117.61494,-103.89044)">
    <!-- 五  (go / five) -->
    <g
       id="kanji-go"
       style="display:inline;stroke:#478cbf;stroke-opacity:1">
      <!-- 1. top horizontal -->
      <path
         id="go-1"
         d="m 130.2,109.5 h 59.2"
         style="stroke:#478cbf;stroke-opacity:1" />
      <!-- 2. vertical, leaning left, top bar all the way to bottom bar -->
      <path
         id="go-2"
         d="m 158.11716,110.06569 -10.73432,49.66862"
         sodipodi:nodetypes="cc"
         style="stroke:#478cbf;stroke-opacity:1" />
      <!-- 3. middle horizontal, turning down to the bottom bar -->
      <path
         id="go-3"
         d="m 135.8,130.7 h 42.3 l -1.4,28.75147"
         sodipodi:nodetypes="ccc"
         style="stroke:#478cbf;stroke-opacity:1" />
      <!-- 4. bottom horizontal (widest) -->
      <path
         id="go-4"
         d="m 127.4,160.3 h 67.7"
         style="stroke:#478cbf;stroke-opacity:1" />
    </g>
    <!-- 大  (dai / big) -->
    <g
       id="kanji-dai"
       style="fill:none;stroke:#478cbf;stroke-width:7.0002;stroke-dasharray:none;stroke-opacity:1">
      <!-- 1. horizontal -->
      <path
         id="dai-1"
         d="m 210.6,120.1 h 62"
         style="fill:none;stroke:#478cbf;stroke-width:7.0002;stroke-dasharray:none;stroke-opacity:1" />
      <!-- 2. left-falling: vertical at the top, sweeping out to the lower left -->
      <path
         id="dai-2"
         d="m 240.2,103.19987 c 0,39.5 -8.5,50.8 -31.1,60.7"
         sodipodi:nodetypes="cc"
         style="fill:none;stroke:#478cbf;stroke-width:7.0002;stroke-dasharray:none;stroke-opacity:1" />
      <!-- 3. right-falling, from the crossing down to the lower right -->
      <path
         id="path2523"
         d="m 240.16162,103.95087 c 0,39.5 8.5,50.8 31.1,60.7"
         inkscape:label="dai-3"
         sodipodi:nodetypes="cc"
         style="fill:none;fill-opacity:1;stroke:#478cbf;stroke-width:7.0002;stroke-dasharray:none;stroke-opacity:1" />
    </g>
  </g>
